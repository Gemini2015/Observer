<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Observer Agent</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="stylesheet" href="/src/styles/index.css" />
  </head>
  <body>
    <div class="app">
      <section id="setup-root" class="setup-view hidden" aria-label="首次配置"></section>

      <div id="main-view" class="main-view hidden">
        <header class="topbar">
          <div class="brand">
            <img class="brand-icon" src="/logo.svg" alt="" />
            <div>
              <div class="brand-title">Observer Agent</div>
              <div id="brand-sub" class="brand-sub">本机文件完整性巡检</div>
            </div>
          </div>
          <nav id="tabs" class="tabs topbar-tabs" role="tablist" aria-label="主导航">
            <button
              id="nav-status"
              class="tab"
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="status-view"
              tabindex="0"
            >
              状态
            </button>
            <button
              id="nav-files"
              class="tab"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="files-view"
              tabindex="-1"
            >
              文件
            </button>
            <button
              id="nav-settings"
              class="tab"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="settings-view"
              tabindex="-1"
            >
              设置
            </button>
          </nav>
          <div class="topbar-status">
            <span id="conn" class="badge badge--warn" title="">
              <span class="dot" aria-hidden="true"></span>
              <span id="conn-text">连接中…</span>
            </span>
          </div>
        </header>

        <main class="view-scroll">
          <section
            id="status-view"
            class="view"
            role="tabpanel"
            aria-labelledby="nav-status"
            tabindex="0"
          ></section>
          <section
            id="files-view"
            class="view hidden"
            role="tabpanel"
            aria-labelledby="nav-files"
            tabindex="0"
          ></section>
          <section
            id="settings-view"
            class="view hidden"
            role="tabpanel"
            aria-labelledby="nav-settings"
            tabindex="0"
          ></section>
        </main>

        <footer class="footer">
          <div class="footer-links">
            <button id="footer-open-hub" class="btn btn-ghost btn-sm" type="button">
              打开 hub Web
            </button>
            <span id="footer-version" class="hint">版本 —</span>
          </div>
          <span class="hint">关闭窗口会隐藏到托盘，巡检继续</span>
        </footer>
      </div>
    </div>

    <div id="toast-root" class="toast-stack" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>
    <div id="drawer-root"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
