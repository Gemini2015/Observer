openapi: 3.1.0
info:
  title: Observer Hub API
  version: 0.2.0
  description: |
    中心服对外接口。M1 包含：健康检查、agent 注册/心跳/结果上报、路径清单、Web 登录与挂载点控制。
    错误统一返回 application/problem+json。
servers:
  - url: http://127.0.0.1:8787
    description: 本地开发

paths:
  /healthz:
    get:
      operationId: health
      summary: 健康检查
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, time]
                properties:
                  status: { type: string, const: ok }
                  time: { type: integer, description: epoch 毫秒 }

  /api/v1/enroll:
    post:
      operationId: enrollAgent
      summary: agent 注册（一次性 token）
      security:
        - enrollToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollRequest' }
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /api/v1/agent/heartbeat:
    post:
      operationId: agentHeartbeat
      summary: agent 心跳（续租 / 取任务 / 清单版本）
      security:
        - agentToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_version: { type: string }
      responses:
        '200':
          description: 心跳结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HeartbeatResponse' }
        '401': { $ref: '#/components/responses/Problem' }

  /api/v1/jobs/{id}/results:
    post:
      operationId: submitResults
      summary: 上报一批扫描结果（按 job+seq 幂等）
      security:
        - agentToken: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResultBatch' }
      responses:
        '200':
          description: 已接收 / 重复批次
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicate, manifest_epoch]
                properties:
                  accepted: { type: integer }
                  duplicate: { type: boolean }
                  manifest_epoch: { type: integer }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /api/v1/jobs/{id}/finish:
    post:
      operationId: finishJob
      summary: 完成任务（触发 missing 判定与覆盖率更新）
      security:
        - agentToken: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinishRequest' }
      responses:
        '200':
          description: 完成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinishResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /api/v1/mounts/{id}/manifest:
    get:
      operationId: getManifest
      summary: 流式下发路径清单（NDJSON + gzip）
      security:
        - agentToken: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 每行一个 JSON：k=path_key, s=size, m=mtime_ns, h=last_hashed_at
          content:
            application/x-ndjson: {}
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/mounts:
    get:
      operationId: listMounts
      summary: 挂载点列表（含覆盖率）
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MountView' }
        '401': { $ref: '#/components/responses/Problem' }

  /api/v1/mounts/{id}/scan:
    post:
      operationId: triggerScan
      summary: 手动触发巡检
      security:
        - sessionCookie: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum: [baseline, incremental, full]
                  default: incremental
      responses:
        '202':
          description: 任务已创建
          content:
            application/json:
              schema:
                type: object
                required: [job_id, mode]
                properties:
                  job_id: { type: integer }
                  mode: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /api/v1/auth/login:
    post:
      operationId: login
      summary: Web 登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '200':
          description: 登录成功（设置 observer_session cookie）
          content:
            application/json:
              schema:
                type: object
                required: [ok, expires_at]
                properties:
                  ok: { type: boolean }
                  expires_at: { type: integer }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    enrollToken:
      type: apiKey
      in: header
      name: X-Observer-Enroll-Token
    agentToken:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: observer_session

  responses:
    Problem:
      description: 错误
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        retryable: { type: boolean }

    Mount:
      type: object
      required: [mount_id, physical_path, rules_hash]
      properties:
        mount_id:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
        label: { type: string }
        physical_path: { type: string }
        sentinel: { type: [string, 'null'] }
        fs_kind:
          type: string
          enum: [local, network, removable, fuse]
          default: local
        case_sensitive:
          type: string
          enum: [auto, 'true', 'false']
          default: auto
        unicode:
          type: string
          enum: [auto, nfc, nfd]
          default: auto
        include:
          type: array
          items: { type: string }
          default: []
        exclude:
          type: array
          items: { type: string }
          default: []
        rules_hash: { type: string }
        limits: { type: object, additionalProperties: true }
        schedule: { type: object, additionalProperties: true }

    EnrollRequest:
      type: object
      required: [machine_id, mounts]
      properties:
        machine_id:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
        label: { type: string }
        hostname: { type: string }
        platform: { type: string }
        arch: { type: string }
        agent_version: { type: string }
        mounts:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Mount' }

    EnrollResponse:
      type: object
      required: [agent_id, token, machine_id, protocol, mounts]
      properties:
        agent_id: { type: integer }
        token: { type: string, description: 长期 agent token，只返回一次 }
        machine_id: { type: string }
        protocol: { type: integer }
        mounts:
          type: array
          items: { $ref: '#/components/schemas/MountRef' }

    MountRef:
      type: object
      required: [id, mount_id, manifest_epoch]
      properties:
        id: { type: integer }
        mount_id: { type: string }
        manifest_epoch: { type: integer }

    MountView:
      type: object
      required: [id, mount_id, state, coverage]
      properties:
        id: { type: integer }
        mount_id: { type: string }
        label: { type: [string, 'null'] }
        machine_id: { type: [string, 'null'] }
        physical_path: { type: string }
        state: { type: string }
        manifest_epoch: { type: integer }
        rules_hash: { type: string }
        include: { type: array, items: { type: string } }
        exclude: { type: array, items: { type: string } }
        coverage: { $ref: '#/components/schemas/Coverage' }

    Coverage:
      type: object
      required: [total, hashed, ratio]
      properties:
        total: { type: integer }
        hashed: { type: integer }
        ratio: { type: number }

    HeartbeatResponse:
      type: object
      required: [server_time, job, cancel, mounts]
      properties:
        server_time: { type: integer }
        job:
          type: [object, 'null']
          properties:
            id: { type: integer }
            mount_pk: { type: integer }
            mount_id: { type: string }
            mode: { type: string, enum: [baseline, incremental, full] }
            lease_until: { type: integer }
        cancel: { type: boolean }
        mounts:
          type: array
          items: { $ref: '#/components/schemas/MountRef' }

    ResultEntry:
      type: object
      required: [path_key, path_display_b64, size, mtime_ns, status]
      properties:
        path_key: { type: string }
        path_display_b64: { type: string, description: 原始路径字节的 base64 }
        size: { type: integer, minimum: 0 }
        mtime_ns: { type: string, description: 纳秒时间戳，十进制字符串 }
        hash: { type: [string, 'null'], description: sha256 hex }
        status:
          type: string
          enum: [ok, skipped, unreadable, unstable]
        skip_reason: { type: string }

    ResultBatch:
      type: object
      required: [seq, entries]
      properties:
        seq: { type: integer, minimum: 0 }
        entries:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/ResultEntry' }

    FinishRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [completed, failed, canceled]
        stats: { type: object, additionalProperties: true }
        guard:
          type: object
          properties:
            status: { type: string, enum: [ok, unavailable, suspect] }
            reason: { type: string }

    FinishResponse:
      type: object
      required: [ok, job_status, coverage]
      properties:
        ok: { type: boolean }
        job_status: { type: string }
        coverage: { $ref: '#/components/schemas/Coverage' }
