name: Release agent, desktop and images

# 开发者手动打 tag 并推送后触发（workflow 不创建/移动/删除任何 tag）：
#   git tag -a v1.3.0 -m "Observer v1.3.0"
#   git push origin v1.3.0
#
# 产物：命令行 agent（linux amd64/arm64、windows amd64）、Windows 桌面端 zip、
#       hub/agent Docker 镜像，以及合并后的 SHA256SUMS。
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish agent
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$tag' does not match vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          version="${tag#v}"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "building observer-agent ${version} from tag ${tag}"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Test agent
        run: |
          cd agent
          go test ./...

      - name: Build release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash scripts/build-release.sh "$VERSION" dist/release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Observer ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/SHA256SUMS

  # 构建 Windows 桌面端（Wails v3）。与 docker job 并行；版本号来自 release job。
  # 与 CLI 分开成 job：桌面端需要 Windows runner、Go 1.26、Node 和 wails3。
  desktop:
    name: Build Windows desktop
    needs: release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/desktop/go.mod
          cache-dependency-path: agent/desktop/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: agent/desktop/frontend/package-lock.json

      - name: Install wails3
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          $wailsBin = Join-Path (go env GOPATH) "bin"
          Add-Content -Path $env:GITHUB_PATH -Value $wailsBin
          $env:PATH = "$wailsBin;$env:PATH"
          if (-not (Get-Command wails3 -ErrorAction SilentlyContinue)) {
            throw "wails3 not found after go install"
          }

      - name: Build desktop release
        shell: pwsh
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/build-desktop-release.ps1 -Version $env:VERSION -OutDir dist/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test desktop
        shell: pwsh
        working-directory: agent/desktop
        run: |
          go test .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test frontend
        shell: pwsh
        working-directory: agent/desktop/frontend
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload desktop asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            "dist/desktop/observer-agent-desktop_${VERSION}_windows_amd64.zip" \
            --clobber

  # 合并 CLI + 桌面端校验和，并在二进制资产都上传成功后再给 Release 正文加下载指引。
  # 放在 finalize job 里，避免桌面端构建失败时 Release 正文宣传不存在的资产。
  finalize-release:
    name: Finalize release assets
    needs: [release, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge binary checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${{ needs.release.outputs.version }}"
          rm -rf assets SHA256SUMS
          mkdir -p assets
          files=(
            "observer-agent_${version}_linux_amd64.tar.gz"
            "observer-agent_${version}_linux_arm64.tar.gz"
            "observer-agent_${version}_windows_amd64.zip"
            "observer-agent-desktop_${version}_windows_amd64.zip"
          )
          # 以 Release 上实际可下载的文件为准重算校验和，避免构建期校验和与上传文件不一致。
          for file in "${files[@]}"; do
            gh release download "$GITHUB_REF_NAME" --pattern "$file" --dir assets
          done
          ( cd assets && sha256sum "${files[@]}" > ../SHA256SUMS )
          cat SHA256SUMS
          for file in "${files[@]}"; do
            if ! grep -Fq "  ${file}" SHA256SUMS; then
              echo "::error::SHA256SUMS missing ${file}"
              exit 1
            fi
          done
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --clobber

      - name: Prepend asset guide to release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${{ needs.release.outputs.version }}"
          rm -f current-notes.md new-notes.md guide.md
          gh release view "$GITHUB_REF_NAME" --json body --jq .body >current-notes.md
          if grep -qF '## 下载哪个包' current-notes.md; then
            echo "asset guide already present; skipping"
            exit 0
          fi
          cat >guide.md <<'EOF'
          ## 下载哪个包

          | 平台 | 文件 | 说明 |
          | --- | --- | --- |
          | **Windows 桌面 GUI** | `observer-agent-desktop_@VERSION@_windows_amd64.zip` | 解压后双击 `observer-agent-desktop.exe`；首次启动进入配置向导；需要 WebView2 Runtime |
          | Windows 命令行 agent | `observer-agent_@VERSION@_windows_amd64.zip` | **不是桌面程序**；双击会打印用法后立即退出，请在 PowerShell 中运行 |
          | Linux agent | `observer-agent_@VERSION@_linux_{amd64,arm64}.tar.gz` | 解压后按 systemd/命令行方式部署 |
          | Docker 镜像 | `observer-*_@VERSION@_linux_*.tar` | `docker load` 后使用，见 docs/DEPLOY-SYNOLOGY.md |

          校验：下载 `SHA256SUMS` 后执行 `sha256sum -c SHA256SUMS`。
          EOF
          sed -i "s/@VERSION@/${version}/g" guide.md
          cat guide.md current-notes.md >new-notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file new-notes.md

  # 为群晖/离线导入构建单架构 Docker 镜像，并作为 Release 资产上传。
  # 不推 Docker Hub/GHCR：镜像以 docker save 的 Docker archive tar 分发。
  docker:
    name: Docker ${{ matrix.image }} (${{ matrix.arch }})
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: hub
            dockerfile: deploy/Dockerfile.hub
            tag: observer-hub
            platform: linux/amd64
            arch: amd64
          - image: hub
            dockerfile: deploy/Dockerfile.hub
            tag: observer-hub
            platform: linux/arm64
            arch: arm64
          - image: agent
            dockerfile: deploy/Dockerfile.agent
            tag: observer-agent
            platform: linux/amd64
            arch: amd64
          - image: agent
            dockerfile: deploy/Dockerfile.agent
            tag: observer-agent
            platform: linux/arm64
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          tags: ${{ matrix.tag }}:${{ needs.release.outputs.version }}
          load: true
          push: false
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            REVISION=${{ github.sha }}
            INSTALL_BUILD_TOOLS=1
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Verify image architecture
        shell: bash
        run: |
          set -euo pipefail
          image="${{ matrix.tag }}:${{ needs.release.outputs.version }}"
          got="$(docker image inspect "$image" --format '{{.Architecture}}')"
          echo "image=$image architecture=$got expected=${{ matrix.arch }}"
          [[ "$got" == "${{ matrix.arch }}" ]]

      - name: Smoke test agent
        if: matrix.image == 'agent'
        shell: bash
        run: |
          set -euo pipefail
          image="${{ matrix.tag }}:${{ needs.release.outputs.version }}"
          got="$(docker run --rm "$image" version)"
          echo "observer-agent version: $got"
          [[ "$got" == "${{ needs.release.outputs.version }}" ]]

      - name: Smoke test hub
        if: matrix.image == 'hub'
        shell: bash
        run: |
          set -euo pipefail
          image="${{ matrix.tag }}:${{ needs.release.outputs.version }}"
          name="observer-hub-smoke-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          volume="observer-hub-smoke-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          cleanup() {
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$name" \
            -e OBSERVER_HOST=0.0.0.0 \
            -e OBSERVER_DATA_DIR=/data \
            -e OBSERVER_ADMIN_PASSWORD=smoke-test-password \
            -p 127.0.0.1:18787:8787 \
            -v "$volume:/data" \
            "$image"

          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18787/healthz >/dev/null 2>&1; then
              echo "hub healthy after ${attempt} attempt(s)"
              # Web 根路径只记录状态，不作为发布门禁（静态资源由镜像 build 阶段保证）。
              curl -sS -o /dev/null -w 'web root status: %{http_code}\n' \
                http://127.0.0.1:18787/ || true
              exit 0
            fi
            sleep 2
          done

          echo "hub did not become healthy" >&2
          docker logs "$name" >&2 || true
          exit 1

      - name: Save image archive
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.release.outputs.version }}"
          image="${{ matrix.tag }}:${version}"
          asset="${{ matrix.tag }}_${version}_linux_${{ matrix.arch }}.tar"
          mkdir -p dist/docker

          docker save -o "dist/docker/$asset" "$image"

          # 群晖 Container Manager 使用 Docker archive；先做一次 load 回归。
          docker load -i "dist/docker/$asset"
          tar -tf "dist/docker/$asset" >"dist/docker/$asset.list"
          grep -qE '(^|/)manifest\.json$' "dist/docker/$asset.list"
          rm -f "dist/docker/$asset.list"

          limit=$((2 * 1024 * 1024 * 1024))
          size="$(stat -c%s "dist/docker/$asset")"
          if (( size >= limit )); then
            echo "error: $asset is ${size} bytes, GitHub Release asset limit is 2 GiB" >&2
            exit 1
          fi

          ( cd dist/docker && sha256sum "$asset" > "$asset.sha256" )
          ls -lh "dist/docker/$asset"
          echo "ASSET=$asset" >>"$GITHUB_ENV"

      - name: Upload checksum fragment
        uses: actions/upload-artifact@v4
        with:
          name: sha-${{ matrix.image }}-${{ matrix.arch }}
          path: dist/docker/*.sha256
          retention-days: 3
          if-no-files-found: error

      - name: Upload image to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            "dist/docker/${ASSET}" \
            "dist/docker/${ASSET}.sha256" \
            --clobber

  docker-checksums:
    name: Publish image checksums
    needs: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download checksum fragments
        uses: actions/download-artifact@v4
        with:
          pattern: sha-*
          path: sums
          merge-multiple: true

      - name: Combine checksums
        shell: bash
        run: |
          set -euo pipefail
          ls -l sums
          cat sums/*.sha256 | sort -k2 > SHA256SUMS-docker
          cat SHA256SUMS-docker

      - name: Upload checksums to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS-docker --clobber
