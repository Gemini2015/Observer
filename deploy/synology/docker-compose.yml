# Observer 群晖 Container Manager 项目（hub + agent 全栈）
#
# 使用前：
# 1. 从 GitHub Release 下载并导入对应架构的镜像：
#      observer-hub:<version> / observer-agent:<version>
# 2. 复制 agent.example.yaml 为 agent.yaml，填写 hub 地址、token、共享文件夹。
# 3. 在每个共享文件夹根目录创建 .observer-mount（内容如 mount_id=photos）。
# 4. Container Manager → 项目 → 使用本目录创建项目。
#
# 本文件不使用 build:、不使用 ${} 变量；镜像 tag 如与下载版本不同，请同步修改。
# 完整说明见 ../../docs/DEPLOY-SYNOLOGY.md。

services:
  hub:
    image: observer-hub:1.1.1
    restart: unless-stopped
    # 若把共享文件夹 bind mount 到 /data 且报 SQLITE_CANTOPEN，取消下面两行注释：
    # 以 root 启动 → 入口脚本修正 /data 属主 → 降权到 node 运行。
    # user: "0:0"
    environment:
      # OBSERVER_FIX_DATA_PERMISSIONS: "1"
      OBSERVER_HOST: "0.0.0.0"
      OBSERVER_DATA_DIR: /data
      OBSERVER_PORT: "8787"
      # 首次启动前必须改成自己的管理员口令
      OBSERVER_ADMIN_PASSWORD: "change-me-please"
      OBSERVER_SCHEDULER_ENABLED: "true"
      OBSERVER_LOG_LEVEL: info
    ports:
      - "8787:8787"
    volumes:
      # 命名卷首次创建会继承镜像内 /data 的 1000:1000；换成共享文件夹时先看文档 §10.1
      - observer-hub-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  agent:
    image: observer-agent:1.1.1
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    command: ["run", "-config", "/etc/observer/agent.yaml"]
    volumes:
      # 项目目录中的 agent.yaml（不要改成 600 root，否则 65532 读不到）
      - ./agent.yaml:/etc/observer/agent.yaml:ro
      # 默认同路径映射：Web 控制台显示的物理路径与 NAS 路径一致。
      # 新增共享文件夹时在这里加一行，并在 agent.yaml 增加对应 mount。
      - /volume1/photo:/volume1/photo:ro
      # 缓存/spool/token 必须可写；命名卷首次创建会继承镜像内 65532 属主。
      - observer-agent-state:/var/lib/observer
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  observer-hub-data:
  observer-agent-state:
