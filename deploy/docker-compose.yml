name: observer

# 使用前：
#   cp deploy/.env.example deploy/.env                    # 填入密码与注册 token
#   cp deploy/agent.example.yaml deploy/agent.yaml         # agent.hub 改成 http://hub:8787
#   mkdir -p deploy/mounts/photos
#   echo 'mount_id=photos' > deploy/mounts/photos/.observer-mount
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# NAS 上建议：
# - 媒体目录只读挂载（./mounts/photos:/media/photos:ro）
# - 状态卷 observer-agent-state 可写（token/cache/spool）
# - agent 容器 read_only，仅状态卷可写
# - UID/GID 与宿主机媒体权限对齐（AGENT_UID/AGENT_GID，默认 distroless nonroot 65532）

services:
  hub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.hub
    restart: unless-stopped
    environment:
      OBSERVER_HOST: "0.0.0.0"
      OBSERVER_DATA_DIR: /data
      OBSERVER_PORT: "8787"
      OBSERVER_ADMIN_PASSWORD: ${OBSERVER_ADMIN_PASSWORD:?请设置 OBSERVER_ADMIN_PASSWORD}
      OBSERVER_SCHEDULER_ENABLED: "true"
      OBSERVER_LOG_LEVEL: info
    ports:
      - "8787:8787"
    volumes:
      - observer-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
    restart: unless-stopped
    read_only: true
    user: "${AGENT_UID:-65532}:${AGENT_GID:-65532}"
    environment:
      OBSERVER_ENROLL_TOKEN: ${OBSERVER_ENROLL_TOKEN:?请先创建注册 token}
    command: ["run", "-config", "/etc/observer/agent.yaml"]
    volumes:
      - ./agent.yaml:/etc/observer/agent.yaml:ro
      - ./mounts:/media:ro
      - observer-agent-state:/var/lib/observer
    depends_on:
      hub:
        condition: service_healthy

volumes:
  observer-data:
  observer-agent-state:
